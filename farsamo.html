<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILWAAD SMART SERVICES - Nidaamka Farsamada</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_#e0f2fe,_#f8fafc_55%,_#eef2ff_100%)] font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const initialTickets = [
            { id: 'REP-1001', macmiil: 'Jaamac Cilmi', tel: '061555123', nooc: 'Laptop', model: 'Dell Latitude', cilaad: 'Shaashadda baa madow', qiimo: '25', taariikh: '2026-07-12', xaalad: 'Gacantaa lagu hayaa' },
            { id: 'REP-1003', macmiil: 'Nimco Ahmed', tel: '061555789', nooc: 'Printer', model: 'Canon MF3010', cilaad: 'Khadka waraaqaha wuu xumaaday', qiimo: '18', taariikh: '2026-07-13', xaalad: 'Baadhitaan' }
        ];

        const initialArchive = [
            { id: 'REP-1002', macmiil: 'Xaliimo Cali', tel: '061555456', nooc: 'Printer', model: 'HP LaserJet', cilaad: 'Khadka ayaa ka dsilan', qiimo: '15', taariikh: '2026-07-14', xaalad: 'Waa Diyaar' }
        ];

        function App() {
            const [tickets, setTickets] = useState(initialTickets);
            const [archive, setArchive] = useState(initialArchive);
            const [macmiil, setMacmiil] = useState('');
            const [tel, setTel] = useState('');
            const [nooc, setNooc] = useState('Laptop');
            const [model, setModel] = useState('');
            const [cilaad, setCilaad] = useState('');
            const [qiimo, setQiimo] = useState('');
            const [taariikh, setTaariikh] = useState(new Date().toISOString().split('T')[0]);
            const [searchTerm, setSearchTerm] = useState('');
            const [feedback, setFeedback] = useState('');
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const savedTickets = localStorage.getItem('ilwaad_tickets');
                        const savedArchive = localStorage.getItem('ilwaad_archive');
                        const response = await fetch('/api/data');

                        if (response.ok) {
                            const data = await response.json();
                            if (data?.tickets && data?.archive) {
                                setTickets(data.tickets);
                                setArchive(data.archive);
                                localStorage.setItem('ilwaad_tickets', JSON.stringify(data.tickets));
                                localStorage.setItem('ilwaad_archive', JSON.stringify(data.archive));
                            } else if (savedTickets && savedArchive) {
                                setTickets(JSON.parse(savedTickets));
                                setArchive(JSON.parse(savedArchive));
                            }
                        } else if (savedTickets && savedArchive) {
                            setTickets(JSON.parse(savedTickets));
                            setArchive(JSON.parse(savedArchive));
                        }
                    } catch (error) {
                        const savedTickets = localStorage.getItem('ilwaad_tickets');
                        const savedArchive = localStorage.getItem('ilwaad_archive');
                        if (savedTickets && savedArchive) {
                            setTickets(JSON.parse(savedTickets));
                            setArchive(JSON.parse(savedArchive));
                        }
                    } finally {
                        setIsLoaded(true);
                    }
                };

                loadData();
            }, []);

            const syncData = async (nextTickets, nextArchive) => {
                if (!isLoaded) return;

                try {
                    localStorage.setItem('ilwaad_tickets', JSON.stringify(nextTickets));
                    localStorage.setItem('ilwaad_archive', JSON.stringify(nextArchive));
                    await fetch('/api/data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tickets: nextTickets, archive: nextArchive })
                    });
                } catch (error) {
                    // Ignore sync failures and keep the local browser copy.
                }
            };

            useEffect(() => {
                if (!isLoaded) return;
                syncData(tickets, archive);
            }, [tickets, archive, isLoaded]);

            useEffect(() => {
                if (!isLoaded) return;

                const intervalId = window.setInterval(async () => {
                    try {
                        const response = await fetch('/api/data');
                        if (!response.ok) return;
                        const data = await response.json();
                        if (data?.tickets && data?.archive) {
                            setTickets(data.tickets);
                            setArchive(data.archive);
                            localStorage.setItem('ilwaad_tickets', JSON.stringify(data.tickets));
                            localStorage.setItem('ilwaad_archive', JSON.stringify(data.archive));
                        }
                    } catch (error) {
                        // Ignore refresh failures.
                    }
                }, 3000);

                return () => window.clearInterval(intervalId);
            }, [isLoaded]);

            const exportBackup = () => {
                const backupData = { tickets, archive };
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(backupData));
                const link = document.createElement('a');
                link.href = dataStr;
                link.download = 'ILWAAD_Data_Backup.json';
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            const importBackup = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.tickets && parsed.archive) {
                            setTickets(parsed.tickets);
                            setArchive(parsed.archive);
                            alert('✅ Xogtii si guul leh ayaa loo soo celiyey!');
                        } else {
                            alert('❌ Faylkan sax maahan!');
                        }
                    } catch (error) {
                        alert('❌ Khalad ayaa dhacay markii faylka la akhriyay.');
                    }
                };
                reader.readAsText(file, 'UTF-8');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!macmiil || !tel || !model || !cilaad || !qiimo || !taariikh) {
                    alert('Fadlan buuxi dhammaan meelaha bannaan!');
                    return;
                }

                const newTicket = {
                    id: `REP-${Math.floor(1000 + Math.random() * 9000)}`,
                    macmiil,
                    tel,
                    nooc,
                    model,
                    cilaad,
                    qiimo,
                    taariikh,
                    xaalad: 'Baadhitaan'
                };

                setTickets(prev => [newTicket, ...prev]);
                setMacmiil('');
                setTel('');
                setModel('');
                setCilaad('');
                setQiimo('');
                setTaariikh(new Date().toISOString().split('T')[0]);
                setNooc('Laptop');
                setSearchTerm('');
                setFeedback(`✅ Qalab cusub waa la kaydiyey: ${newTicket.id}`);
            };

            const handleStatusChange = (id, newStatus) => {
                setTickets(prev => prev.map(item => item.id === id ? { ...item, xaalad: newStatus } : item));
            };

            const handleArchive = (ticket) => {
                if (window.confirm(`Ma hubtaa in qalabkan (${ticket.id}) loo wareejiyo kaydka guud?`)) {
                    const archivedItem = { ...ticket, xaalad: 'La Bixiyay' };
                    setArchive(prev => [archivedItem, ...prev]);
                    setTickets(prev => prev.filter(item => item.id !== ticket.id));
                    setFeedback(`📦 ${ticket.id} waa la dhigay kaydka guud.`);
                }
            };

            const handlePermanentDelete = (id) => {
                if (window.confirm('Ma hubtaa inaad tirtirto?')) {
                    setArchive(prev => prev.filter(item => item.id !== id));
                    setFeedback('🗑️ Qalabku waa la tirtiray.');
                }
            };

            const filteredTickets = tickets.filter(item => {
                const query = searchTerm.toLowerCase();
                return item.macmiil.toLowerCase().includes(query) || item.tel.includes(searchTerm) || item.id.toLowerCase().includes(query);
            });

            const filteredArchive = archive.filter(item => {
                const query = searchTerm.toLowerCase();
                return item.macmiil.toLowerCase().includes(query) || item.tel.includes(searchTerm) || item.id.toLowerCase().includes(query);
            });

            const totalRevenue = tickets.reduce((sum, item) => sum + Number(item.qiimo || 0), 0);

            const renderNoocIcon = (nooc) => {
                if (nooc === 'Laptop') return '💻 Laptop';
                if (nooc === 'Printer') return '🖨️ Printer';
                return '📦 All-in-One';
            };

            return (
                <div className="min-h-screen bg-transparent text-gray-800">
                    <header className="bg-gradient-to-r from-slate-900 via-blue-800 to-indigo-800 text-white shadow-[0_20px_60px_rgba(15,23,42,0.28)]">
                        <div className="container mx-auto px-4 py-7 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-white text-blue-700 rounded-2xl w-13 h-13 flex items-center justify-center text-xl font-black shadow-lg">ILW</div>
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">ILWAAD SMART SERVICES</h1>
                                    <p className="text-blue-100 text-xs uppercase tracking-[0.35em]">Laptop &amp; Printer Repair Center</p>
                                </div>
                            </div>

                            <div className="w-full md:w-80">
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="🔍 Raadi magac, taleefon, ama ID"
                                    className="w-full px-4 py-2.5 rounded-full text-gray-800 border border-white/20 bg-white/95 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                                />
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 py-6 space-y-6">
                        <section className="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-3xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 shadow-sm">
                            <div>
                                <h2 className="font-bold text-yellow-800">⚠️ Badbaadi xogtaada</h2>
                                <p className="text-sm text-yellow-700">Xogtaadu waxa la keydinayaa server-kaaga, sidaas darteed qof kasta oo kombiyuutar kale ku jira shirkadda wuu arki karaa wixii la diiwaangeliyay.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={exportBackup} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold text-sm shadow-sm transition-transform duration-150 hover:-translate-y-0.5">
                                    📥 Soo dejiso backup
                                </button>
                                <label className="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-semibold text-sm shadow-sm cursor-pointer transition-transform duration-150 hover:-translate-y-0.5">
                                    📤 Soo celi backup
                                    <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                </label>
                            </div>
                        </section>

                        {feedback ? (
                            <section className="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700 shadow-sm">
                                {feedback}
                            </section>
                        ) : null}

                        <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="rounded-3xl border border-blue-100 bg-gradient-to-br from-blue-600 to-indigo-700 p-4 text-white shadow-[0_14px_35px_rgba(59,130,246,0.25)]">
                                <p className="text-sm text-blue-100">Qalabka hadda gacanta ku jira</p>
                                <p className="mt-2 text-3xl font-black">{tickets.length}</p>
                                <p className="mt-1 text-xs uppercase tracking-[0.25em] text-blue-100">Aynu ku aragno si cad</p>
                            </div>
                            <div className="rounded-3xl border border-slate-100 bg-gradient-to-br from-slate-700 to-slate-900 p-4 text-white shadow-[0_14px_35px_rgba(15,23,42,0.2)]">
                                <p className="text-sm text-slate-300">Qalabka la bixiyay</p>
                                <p className="mt-2 text-3xl font-black">{archive.length}</p>
                                <p className="mt-1 text-xs uppercase tracking-[0.25em] text-slate-300">Kaydka guud</p>
                            </div>
                            <div className="rounded-3xl border border-emerald-100 bg-gradient-to-br from-emerald-500 to-green-600 p-4 text-white shadow-[0_14px_35px_rgba(16,185,129,0.22)]">
                                <p className="text-sm text-emerald-100">Wadarta lacagta</p>
                                <p className="mt-2 text-3xl font-black">${totalRevenue}</p>
                                <p className="mt-1 text-xs uppercase tracking-[0.25em] text-emerald-100">Korsari</p>
                            </div>
                        </section>

                        <section className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-1 bg-white/90 rounded-3xl p-6 shadow-[0_16px_40px_rgba(15,23,42,0.08)] border border-gray-100 h-fit backdrop-blur">
                                <h2 className="text-xl font-bold text-gray-800 mb-5 border-b border-gray-100 pb-3">📥 Diwaangeli qalab cusub</h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Magaca macmiilka</label>
                                        <input type="text" value={macmiil} onChange={(e) => setMacmiil(e.target.value)} placeholder="Cali Axmed" className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Taleefanka</label>
                                        <input type="tel" value={tel} onChange={(e) => setTel(e.target.value)} placeholder="061XXXXXXX" className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Nooca</label>
                                            <select value={nooc} onChange={(e) => setNooc(e.target.value)} className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50">
                                                <option value="Laptop">💻 Laptop</option>
                                                <option value="Printer">🖨️ Printer</option>
                                                <option value="All-in-One">📦 All-in-One</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Qiimaha ($)</label>
                                            <input type="number" value={qiimo} onChange={(e) => setQiimo(e.target.value)} placeholder="20" className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Taariikhda</label>
                                        <input type="date" value={taariikh} onChange={(e) => setTaariikh(e.target.value)} className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Model-ka</label>
                                        <input type="text" value={model} onChange={(e) => setModel(e.target.value)} placeholder="HP EliteBook" className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-600 text-xs font-bold uppercase mb-1">Ciladda</label>
                                        <textarea rows="3" value={cilaad} onChange={(e) => setCilaad(e.target.value)} placeholder="Sharaxaad kooban" className="w-full p-2.5 border border-gray-200 rounded-xl bg-gray-50/50"></textarea>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-transform duration-150 hover:-translate-y-0.5">
                                        💾 Kaydi qalabka
                                    </button>
                                </form>
                            </div>

                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-white/95 rounded-3xl p-6 shadow-[0_16px_40px_rgba(15,23,42,0.08)] border border-gray-100">
                                    <div className="mb-4 flex items-center justify-between rounded-2xl border border-blue-100 bg-blue-50/70 px-4 py-3">
                                        <div>
                                            <p className="text-[11px] font-semibold uppercase tracking-[0.25em] text-blue-600">Qalabka</p>
                                            <h2 className="text-lg font-black text-slate-800">Gacanta ku jira</h2>
                                        </div>
                                        <div className="rounded-full bg-white px-3 py-1 text-sm font-bold text-blue-700 shadow-sm">{filteredTickets.length} total</div>
                                    </div>
                                    <div className="overflow-x-auto rounded-2xl border border-gray-100">
                                        <table className="min-w-full text-sm text-left">
                                            <thead className="bg-gray-50 text-gray-500 uppercase text-xs">
                                                <tr>
                                                    <th className="p-3">ID / Taariikh</th>
                                                    <th className="p-3">Macmiilka</th>
                                                    <th className="p-3">Nooca &amp; Model</th>
                                                    <th className="p-3">Qiimaha</th>
                                                    <th className="p-3">Xaalad</th>
                                                    <th className="p-3">Aaladaha</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {filteredTickets.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="6" className="p-4 text-center text-gray-500">Ma jiro natiijooyin la soo bandhigay.</td>
                                                    </tr>
                                                ) : (
                                                    filteredTickets.map(ticket => (
                                                        <tr key={ticket.id} className="hover:bg-gray-50">
                                                            <td className="p-3">
                                                                <span className="font-bold text-blue-600 block">{ticket.id}</span>
                                                                <span className="text-[11px] text-gray-400">{ticket.taariikh}</span>
                                                            </td>
                                                            <td className="p-3">
                                                                <span className="font-semibold block">{ticket.macmiil}</span>
                                                                <span className="text-xs text-gray-400">{ticket.tel}</span>
                                                            </td>
                                                            <td className="p-3">
                                                                <span className="inline-block bg-gray-100 text-gray-700 text-[11px] font-bold px-2 py-0.5 rounded mb-1">{renderNoocIcon(ticket.nooc)}</span>
                                                                <span className="block text-gray-700 text-xs">{ticket.model}</span>
                                                                <span className="text-[10px] text-gray-400">{ticket.cilaad}</span>
                                                            </td>
                                                            <td className="p-3 font-bold text-gray-800">${ticket.qiimo}</td>
                                                            <td className="p-3">
                                                                <select value={ticket.xaalad} onChange={(e) => handleStatusChange(ticket.id, e.target.value)} className="rounded-lg border border-gray-200 bg-white p-1.5 text-xs font-bold">
                                                                    <option value="Baadhitaan">🔴 Baadhitaan</option>
                                                                    <option value="Gacantaa lagu hayaa">🟡 Gacantaa</option>
                                                                    <option value="Waa Diyaar">🟢 Diyaar</option>
                                                                </select>
                                                            </td>
                                                            <td className="p-3">
                                                                <button onClick={() => handleArchive(ticket)} className="bg-indigo-50 text-indigo-700 border border-indigo-100 px-2.5 py-1.5 rounded-lg text-xs font-bold">
                                                                    📦 Bixi (kaydi)
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-gray-50/90 rounded-3xl p-6 shadow-[0_12px_30px_rgba(15,23,42,0.05)] border border-gray-200">
                                    <div className="mb-4 flex items-center justify-between rounded-2xl border border-slate-200 bg-white px-4 py-3">
                                        <div>
                                            <p className="text-[11px] font-semibold uppercase tracking-[0.25em] text-slate-500">Kaydka</p>
                                            <h2 className="text-lg font-black text-slate-800">Qalabka la bixiyay</h2>
                                        </div>
                                        <div className="rounded-full bg-slate-100 px-3 py-1 text-sm font-bold text-slate-700 shadow-sm">{filteredArchive.length} total</div>
                                    </div>
                                    <div className="overflow-x-auto rounded-2xl border border-gray-200 bg-white">
                                        <table className="min-w-full text-sm text-left">
                                            <thead className="bg-gray-100 text-gray-500 uppercase text-xs">
                                                <tr>
                                                    <th className="p-3">ID / Taariikh</th>
                                                    <th className="p-3">Macmiilka</th>
                                                    <th className="p-3">Nooca &amp; Model</th>
                                                    <th className="p-3">Qiimaha</th>
                                                    <th className="p-3">Xaalad</th>
                                                    <th className="p-3">Xakamayn</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {filteredArchive.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="6" className="p-4 text-center text-gray-500">Ma jiro wax archive ah.</td>
                                                    </tr>
                                                ) : (
                                                    filteredArchive.map(item => (
                                                        <tr key={item.id} className="hover:bg-gray-50">
                                                            <td className="p-3">
                                                                <span className="font-bold text-gray-500 block">{item.id}</span>
                                                                <span className="text-[11px] text-gray-400">{item.taariikh}</span>
                                                            </td>
                                                            <td className="p-3">
                                                                <span className="font-semibold block">{item.macmiil}</span>
                                                                <span className="text-xs text-gray-400">{item.tel}</span>
                                                            </td>
                                                            <td className="p-3">
                                                                <span className="inline-block bg-gray-100 text-gray-600 text-[11px] font-bold px-2 py-0.5 rounded mb-1">{renderNoocIcon(item.nooc)}</span>
                                                                <span className="block text-gray-700 text-xs">{item.model}</span>
                                                                <span className="text-[10px] text-gray-400">{item.cilaad}</span>
                                                            </td>
                                                            <td className="p-3 font-bold text-gray-700">${item.qiimo}</td>
                                                            <td className="p-3">
                                                                <span className="bg-gray-100 text-gray-600 text-[11px] font-bold px-2 py-1 rounded-md border border-gray-200">✅ {item.xaalad}</span>
                                                            </td>
                                                            <td className="p-3">
                                                                <button onClick={() => handlePermanentDelete(item.id)} className="text-red-500 hover:text-red-700 text-xs font-semibold">
                                                                    ❌ Tir-tir
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
